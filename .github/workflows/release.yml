name: release

# Build prebuilt binaries for each supported platform and attach them to the
# draft GitHub Release whenever a v* tag is pushed. herdr/install.sh downloads
# the matching asset on plugin install. Publish the draft manually after review.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  create-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md
          title: v$version
          draft: true
          token: ${{ secrets.GITHUB_TOKEN }}

  binaries:
    needs: create-release
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: herdr-tab-smart-rename-rs
          target: ${{ matrix.target }}
          archive: $bin-$target
          checksum: sha256
          locked: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: herdr-tab-smart-rename-rs-${{ matrix.target }}.tar.gz
