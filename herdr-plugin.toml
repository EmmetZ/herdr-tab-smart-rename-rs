id = "tab-smart-rename"
name = "Smart Rename"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Rust-powered context-aware names for Herdr task tabs."
platforms = ["linux", "macos"]

[[build]]
command = ["bash", "herdr/install.sh"]

[[actions]]
id = "rename-now"
title = "Smart Rename: current tab"
description = "Read the current tab context and rename it now."
contexts = ["workspace", "tab", "pane"]
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/herdr-tab-smart-rename-rs\" rename-now"]

[[actions]]
id = "check-ai"
title = "Smart Rename: check AI config"
description = "Validate provider settings and prompt files without making a request."
contexts = ["global", "workspace", "tab", "pane"]
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/herdr-tab-smart-rename-rs\" check-ai"]

[[actions]]
id = "configure-ai"
title = "Smart Rename: configure AI"
description = "Open the private AI provider configuration."
contexts = ["global", "workspace", "tab", "pane"]
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/herdr-tab-smart-rename-rs\" configure-ai"]

[[events]]
on = "pane.agent_status_changed"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/herdr-tab-smart-rename-rs\" agent-status-event"]
